<!DOCTYPE html>

<html lang="pt-BR">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Dashboard — Mostra Científica UniAtenas
</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
>

<style>

    body {
        background:
            radial-gradient(
                circle at top,
                #202938 0%,
                #10151d 45%,
                #080b10 100%
            );

        color: #f8f9fa;
        min-height: 100vh;
    }

    .dashboard-header {
        padding: 28px 0 18px;
    }

    .dashboard-title {
        font-weight: 700;
        letter-spacing: -0.5px;
    }

    .live-indicator {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
        color: #adb5bd;
    }

    .live-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #20c997;
        box-shadow: 0 0 10px #20c997;
        animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
        0%, 100% {
            opacity: 1;
            transform: scale(1);
        }

        50% {
            opacity: .45;
            transform: scale(.75);
        }
    }

    .stat-card {
        background: rgba(255,255,255,.055);
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 14px;
        padding: 18px 20px;
    }

    .stat-label {
        color: #8f9baa;
        font-size: .78rem;
        text-transform: uppercase;
        letter-spacing: .08em;
    }

    .stat-value {
        font-size: 2rem;
        font-weight: 700;
        line-height: 1.1;
    }

    #chart {
        position: relative;
        margin-top: 20px;
        padding: 15px 0;
        min-height: 100px;
    }

    .bar-row {
        position: absolute;
        left: 0;
        right: 0;
        height: 86px;
        margin-bottom: 0;

        transition:
            transform 850ms cubic-bezier(.2,.8,.2,1);

        will-change: transform;
    }

    .rank-number {
        position: absolute;
        left: 0;
        top: 23px;

        width: 38px;

        color: #7d8794;
        font-size: 1.15rem;
        font-weight: 700;

        text-align: center;
    }

    .bar-content {
        position: absolute;

        left: 50px;
        right: 0;
        top: 5px;
        height: 76px;

        border-radius: 12px;

        background:
            linear-gradient(
                90deg,
                rgba(13,110,253,.30),
                rgba(13,110,253,.12)
            );

        border: 1px solid rgba(255,255,255,.07);

        overflow: hidden;

        transition:
            background 300ms ease,
            border-color 300ms ease;
    }

    .bar-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;

        width: 0%;

        border-radius: 11px;

        background:
            linear-gradient(
                90deg,
                #0d6efd,
                #6ea8fe
            );

        transition:
            width 850ms cubic-bezier(.2,.8,.2,1);
    }

    .bar-info {
        position: absolute;
        inset: 0;

        display: flex;
        align-items: center;

        padding: 0 20px;

        z-index: 2;

        pointer-events: none;
    }

    .bar-text {
        min-width: 0;
        flex: 1;
    }

    .work-code {
        font-size: .72rem;
        font-weight: 700;
        letter-spacing: .08em;
        opacity: .75;
    }

    .work-title {
        font-size: 1rem;
        font-weight: 650;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .work-authors {
        font-size: .76rem;
        color: rgba(255,255,255,.72);

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .vote-count {
        margin-left: 18px;

        min-width: 70px;

        text-align: right;

        font-size: 1.45rem;
        font-weight: 800;

        text-shadow:
            0 2px 5px rgba(0,0,0,.3);
    }

    .vote-label {
        display: block;
        font-size: .65rem;
        font-weight: 500;
        opacity: .7;
        text-transform: uppercase;
    }

    .leader .bar-content {
        border-color: rgba(255,255,255,.25);
    }

    .leader .bar-fill {
        background:
            linear-gradient(
                90deg,
                #ffc107,
                #ffda6a
            );
    }

    .empty {
        text-align: center;
        color: #8f9baa;
        padding: 60px 20px;
    }

    @media (max-width: 600px) {

        .dashboard-title {
            font-size: 1.5rem;
        }

        .bar-row {
            height: 96px;
        }

        .bar-content {
            left: 38px;
            height: 86px;
        }

        .rank-number {
            width: 30px;
            font-size: .95rem;
        }

        .bar-info {
            padding: 0 12px;
        }

        .work-title {
            font-size: .85rem;
        }

        .work-authors {
            font-size: .68rem;
        }

        .vote-count {
            min-width: 48px;
            font-size: 1.15rem;
        }

    }

    @media (prefers-reduced-motion: reduce) {

        .bar-row,
        .bar-fill {
            transition: none !important;
        }

        .live-dot {
            animation: none;
        }

    }

</style>


</head>

<body>

<!-- =========================================================
     NAVBAR
========================================================= -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm fixed-top">


<div class="container">

    <a
        class="navbar-brand d-flex align-items-center gap-2"
        href="/"
    >
        <img
            src="{{ url_for('static', filename='images/logo_uniatenas.png') }}"
            alt="UniAtenas"
            height="42"
        >
    </a>


    <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarPrincipal"
        aria-controls="navbarPrincipal"
        aria-expanded="false"
        aria-label="Abrir menu"
    >
        <span class="navbar-toggler-icon"></span>
    </button>


    <div
        class="collapse navbar-collapse"
        id="navbarPrincipal"
    >

        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">

            <li class="nav-item">
                <a
                    class="nav-link"
                    href="/#evento"
                >
                    Evento
                </a>
            </li>


            <li class="nav-item">
                <a
                    class="nav-link"
                    href="/#programacao"
                >
                    Programação
                </a>
            </li>


            <li class="nav-item">
                <a
                    class="nav-link"
                    href="/#votacao"
                >
                    Votação
                </a>
            </li>


            <li class="nav-item">
                <a
                    class="nav-link"
                    href="/anais"
                >
                    Anais
                </a>
            </li>


            <li class="nav-item ms-lg-2 mt-2 mt-lg-0">

                <a
                    class="btn btn-outline-light btn-sm active"
                    aria-current="page"
                    href="/dashboard"
                >
                    <i class="bi bi-bar-chart-line me-1"></i>
                    Votos em tempo real
                </a>

            </li>

        </ul>

    </div>

</div>


</nav>

<!-- =========================================================
     DASHBOARD
========================================================= -->

<div class="container">


<header class="dashboard-header">

    <div
        class="d-flex justify-content-between align-items-center flex-wrap gap-3"
    >

        <div>

            <div class="live-indicator mb-2">

                <span class="live-dot"></span>

                VOTAÇÃO AO VIVO

            </div>

            <h1 class="dashboard-title mb-1">
                Mostra Científica UniAtenas
            </h1>

            <div class="text-secondary">
                Ranking dos trabalhos
            </div>

        </div>


        <div class="text-end">

            <div class="stat-label">
                Total de votos
            </div>

            <div
                id="total-votos"
                class="stat-value"
            >
                0
            </div>

        </div>

    </div>

</header>


<div class="row g-3 mb-2">

    <div class="col-6 col-md-3">

        <div class="stat-card">

            <div class="stat-label">
                Trabalhos
            </div>

            <div
                id="total-trabalhos"
                class="stat-value"
            >
                0
            </div>

        </div>

    </div>


    <div class="col-6 col-md-3">

        <div class="stat-card">

            <div class="stat-label">
                Atualização
            </div>

            <div
                id="ultima-atualizacao"
                class="text-secondary mt-2"
            >
                aguardando...
            </div>

        </div>

    </div>

</div>


<main id="chart">

    <div class="empty">
        Carregando votação...
    </div>

</main>


</div>

<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>

const chart = document.getElementById("chart");

const totalVotos =
    document.getElementById("total-votos");

const totalTrabalhos =
    document.getElementById("total-trabalhos");

const ultimaAtualizacao =
    document.getElementById("ultima-atualizacao");


let trabalhosAtuais = new Map();


function getRowHeight() {

    return window.matchMedia("(max-width: 600px)").matches
        ? 96
        : 94;

}


function escaparHTML(valor) {

    const div = document.createElement("div");

    div.textContent = valor ?? "";

    return div.innerHTML;

}


function atualizarDashboard(dados) {

    const trabalhos = dados.trabalhos || [];


    totalVotos.textContent =
        dados.total_votos ?? 0;


    totalTrabalhos.textContent =
        trabalhos.length;


    if (trabalhos.length === 0) {

        chart.innerHTML = `
            <div class="empty">
                Nenhum trabalho cadastrado.
            </div>
        `;

        chart.style.height = "";

        return;

    }


    const empty =
        chart.querySelector(".empty");

    if (empty) {
        empty.remove();
    }


    const maiorNumeroVotos =
        Math.max(
            1,
            ...trabalhos.map(
                t => Number(t.votos) || 0
            )
        );


    const rowHeight =
        getRowHeight();


    trabalhos.forEach(trabalho => {

        const id =
            String(trabalho.id);


        if (
            document.getElementById(
                `bar-${id}`
            )
        ) {
            return;
        }


        const row =
            document.createElement("div");


        row.className =
            "bar-row";


        row.id =
            `bar-${id}`;


        row.innerHTML = `

            <div class="rank-number">
                ${trabalho.posicao}
            </div>

            <div class="bar-content">

                <div class="bar-fill"></div>

                <div class="bar-info">

                    <div class="bar-text">

                        <div class="work-code">
                            ${escaparHTML(trabalho.codigo)}
                        </div>

                        <div class="work-title">
                            ${escaparHTML(trabalho.titulo)}
                        </div>

                        <div class="work-authors">
                            ${escaparHTML(
                                trabalho.autores ||
                                "Autor(es) não informado"
                            )}
                        </div>

                    </div>


                    <div class="vote-count">

                        <span class="number">
                            0
                        </span>

                        <span class="vote-label">
                            votos
                        </span>

                    </div>

                </div>

            </div>

        `;


        chart.appendChild(row);

    });


    trabalhos.forEach(
        (trabalho, indice) => {

            const id =
                String(trabalho.id);


            const row =
                document.getElementById(
                    `bar-${id}`
                );


            if (!row) {
                return;
            }


            row.style.transform =
                `translateY(${indice * rowHeight}px)`;


            const fill =
                row.querySelector(".bar-fill");


            const numero =
                row.querySelector(".number");


            const votos =
                Number(trabalho.votos) || 0;


            const percentual =
                maiorNumeroVotos > 0
                    ? (votos / maiorNumeroVotos) * 100
                    : 0;


            fill.style.width =
                `${percentual}%`;


            numero.textContent =
                votos;


            const rank =
                row.querySelector(
                    ".rank-number"
                );


            rank.textContent =
                trabalho.posicao;


            if (indice === 0) {

                row.classList.add(
                    "leader"
                );

            } else {

                row.classList.remove(
                    "leader"
                );

            }

        }
    );


    chart.style.height =
        `${Math.max(
            100,
            trabalhos.length * rowHeight + 10
        )}px`;


    ultimaAtualizacao.textContent =
        new Date().toLocaleTimeString(
            "pt-BR"
        );


    trabalhosAtuais =
        new Map(
            trabalhos.map(
                t => [
                    String(t.id),
                    Number(t.votos) || 0
                ]
            )
        );

}


async function atualizar() {

    try {

        const response =
            await fetch(
                "/api/ranking",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Erro HTTP " +
                response.status
            );

        }


        const dados =
            await response.json();


        atualizarDashboard(
            dados
        );


    } catch (erro) {

        console.error(
            "Erro ao atualizar ranking:",
            erro
        );

    }

}


/*
 * Primeira atualização imediata.
 */

atualizar();


/*
 * Atualização praticamente em tempo real.
 */

setInterval(
    atualizar,
    1000
);

</script>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

</body>
</html>
