<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ranking — Mostra Científica</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            href="/"
            class="navbar-brand"
        >
            Mostra Científica UniAtenas
        </a>

        <span class="text-white">
            Ranking
        </span>

    </div>

</nav>

<main class="container py-5">

    <div class="text-center mb-4">

        <h1>
            Ranking da Votação
        </h1>

        <p class="text-muted">
            A classificação é atualizada automaticamente.
        </p>

        <div>
            Total de votos:
            <strong id="total-votos">0</strong>
        </div>

    </div>

    <div
        id="ranking"
        class="table-responsive"
    ></div>

    <p
        id="atualizado"
        class="text-center text-muted mt-3"
    ></p>

</main>

<script src="{{ url_for('static', filename='js/ranking.js') }}"></script>

</body>
</html>
