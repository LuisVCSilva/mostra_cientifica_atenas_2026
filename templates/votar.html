<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Votação — Mostra Científica</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand">
            Mostra Científica UniAtenas
        </span>

        <button
            id="logout"
            class="btn btn-outline-light btn-sm"
        >
            Sair
        </button>

    </div>

</nav>

<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1 class="h3">
                Escolha o trabalho
            </h1>

            <p
                id="participante"
                class="text-muted mb-0"
            ></p>

        </div>

        <span
            id="status-votacao"
            class="badge bg-success"
        >
            Votação aberta
        </span>

    </div>

    <div
        id="mensagem"
        class="mb-3"
    ></div>

    <div
        id="trabalhos"
        class="row g-4"
    ></div>

</main>

<script src="{{ url_for('static', filename='js/votar.js') }}"></script>

</body>
</html>
