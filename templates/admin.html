<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administração — Mostra Científica</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand">
            Administração
        </span>

    </div>

</nav>

<main class="container py-5">

    <h1 class="h3 mb-4">
        Controle da votação
    </h1>

    <div
        id="mensagem"
        class="mb-3"
    ></div>

    <div class="row g-3 mb-4">

        <div class="col-md-4">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h2 class="h6">
                        Participantes
                    </h2>

                    <p
                        id="participantes"
                        class="display-6"
                    >
                        0
                    </p>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h2 class="h6">
                        Trabalhos
                    </h2>

                    <p
                        id="trabalhos"
                        class="display-6"
                    >
                        0
                    </p>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h2 class="h6">
                        Votos
                    </h2>

                    <p
                        id="votos"
                        class="display-6"
                    >
                        0
                    </p>

                </div>

            </div>

        </div>

    </div>

    <div class="card shadow">

        <div class="card-body">

            <h2 class="h5">
                Status da votação
            </h2>

            <p>
                Status atual:
                <strong id="status">
                    carregando...
                </strong>
            </p>

            <button
                id="toggle-votacao"
                class="btn btn-primary"
            >
                Alterar status
            </button>

        </div>

    </div>

</main>

<script>

async function carregarEstatisticas() {

    const response = await fetch(
        "/api/admin/estatisticas"
    );

    if (!response.ok) {
        return;
    }

    const data = await response.json();

    document.getElementById("participantes")
        .textContent = data.participantes;

    document.getElementById("trabalhos")
        .textContent = data.trabalhos;

    document.getElementById("votos")
        .textContent = data.votos;

    const status = document.getElementById("status");

    status.textContent =
        data.votacao_aberta
            ? "ABERTA"
            : "ENCERRADA";

    status.className =
        data.votacao_aberta
            ? "text-success"
            : "text-danger";

    document.getElementById("toggle-votacao")
        .textContent =
        data.votacao_aberta
            ? "Encerrar votação"
            : "Abrir votação";

    document.getElementById("toggle-votacao")
        .dataset.aberta =
        data.votacao_aberta
            ? "false"
            : "true";
}


document
    .getElementById("toggle-votacao")
    .addEventListener("click", async function() {

        const aberta =
            this.dataset.aberta === "true";

        const response = await fetch(
            "/api/admin/votacao",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    aberta: aberta
                })
            }
        );

        const data = await response.json();

        const mensagem =
            document.getElementById("mensagem");

        if (!response.ok) {

            mensagem.innerHTML = `
                <div class="alert alert-danger">
                    ${data.erro}
                </div>
            `;

            return;
        }

        mensagem.innerHTML = `
            <div class="alert alert-success">
                Status alterado com sucesso.
            </div>
        `;

        carregarEstatisticas();

    });


carregarEstatisticas();

setInterval(
    carregarEstatisticas,
    2000
);

</script>

</body>
</html>
